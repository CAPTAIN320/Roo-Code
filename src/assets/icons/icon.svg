<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Background rounded square -->
  <rect width="96" height="96" rx="16" ry="16" fill="#1a1a2e"/>

  <!-- Captain's wheel (ship's helm) -->
  <!-- Outer ring -->
  <circle cx="48" cy="48" r="34" fill="none" stroke="#e8c84a" stroke-width="4"/>
  <!-- Inner hub -->
  <circle cx="48" cy="48" r="10" fill="#e8c84a"/>
  <!-- Center hole -->
  <circle cx="48" cy="48" r="4" fill="#1a1a2e"/>

  <!-- 8 spokes -->
  <!-- Top -->
  <line x1="48" y1="14" x2="48" y2="38" stroke="#e8c84a" stroke-width="4" stroke-linecap="round"/>
  <!-- Bottom -->
  <line x1="48" y1="58" x2="48" y2="82" stroke="#e8c44a" stroke-width="4" stroke-linecap="round"/>
  <!-- Left -->
  <line x1="14" y1="48" x2="38" y2="48" stroke="#e8c44a" stroke-width="4" stroke-linecap="round"/>
  <!-- Right -->
  <line x1="58" y1="48" x2="82" y2="48" stroke="#e8c44a" stroke-width="4" stroke-linecap="round"/>
  <!-- Top-left diagonal -->
  <line x1="23.9" y1="23.9" x2="40.9" y2="40.9" stroke="#e8c44a" stroke-width="4" stroke-linecap="round"/>
  <!-- Bottom-right diagonal -->
  <line x1="55.1" y1="55.1" x2="72.1" y2="72.1" stroke="#e8c44a" stroke-width="4" stroke-linecap="round"/>
  <!-- Top-right diagonal -->
  <line x1="72.1" y1="23.9" x2="55.1" y2="40.9" stroke="#e8c44a" stroke-width="4" stroke-linecap="round"/>
  <!-- Bottom-left diagonal -->
  <line x1="40.9" y1="55.1" x2="23.9" y2="72.1" stroke="#e8c44a" stroke-width="4" stroke-linecap="round"/>

  <!-- Spoke handle knobs (small circles at the ends of each spoke on the outer ring) -->
  <circle cx="48" cy="14" r="3.5" fill="#e8c44a"/>
  <circle cx="48" cy="82" r="3.5" fill="#e8c44a"/>
  <circle cx="14" cy="48" r="3.5" fill="#e8c44a"/>
  <circle cx="82" cy="48" r="3.5" fill="#e8c44a"/>
  <circle cx="23.9" cy="23.9" r="3.5" fill="#e8c44a"/>
  <circle cx="72.1" cy="72.1" r="3.5" fill="#e8c44a"/>
  <circle cx="72.1" cy="23.9" r="3.5" fill="#e8c44a"/>
  <circle cx="23.9" cy="72.1" r="3.5" fill="#e8c44a"/>
</svg>
